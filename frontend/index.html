<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f3" />
    <script>
      // Apply the preference before the stylesheet to avoid a light flash.
      ;(() => {
        let theme = 'system'
        try {
          theme = localStorage.getItem('ai-sdr.theme') || 'system'
        } catch {}
        const resolved =
          theme === 'light' || theme === 'dark'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
        document.querySelector('meta[name="theme-color"]').content =
          resolved === 'dark' ? '#191919' : '#f6f6f3'
      })()
    </script>
    <meta
      name="description"
      content="AI SDR researches a company and drafts a personalised cold email for you to review."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI SDR · Outreach workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
