# Evaluation cases. Each one is a brief plus the outcomes a careful human would accept:
#   draft             - enough verified facts, a fitting offer: a draft is expected
#   poor_fit          - a draft, but strategy must judge the offer a poor fit
#   insufficient_data - too little reliable information to write a specific email
#   website_mismatch  - the website belongs to a different company
# Expectations are set from the recorded search snapshot, never from model outputs.
# holdout = true cases are kept out of prompt and model tuning and run only for the final check.

# --- Well-known companies

[[case]]
id = "linear"
company = "Linear"
website = "linear.app"
offer = "Recruiting and scheduling customer interview participants for product teams"
recipient = "Head of Product"
expect = ["draft"]
note = "The stage 2-4 manual run; the link to the offer was a stretch there."

[[case]]
id = "stripe"
company = "Stripe"
website = "stripe.com"
offer = "Localizing developer documentation into Japanese, German and Brazilian Portuguese"
recipient = "Head of Documentation"
tone = "Warm"
expect = ["draft"]

[[case]]
id = "duolingo"
company = "Duolingo"
website = "duolingo.com"
offer = "Voice actors and audio production for language-learning content"
recipient = "Director of Learning Content"
expect = ["draft"]

[[case]]
id = "gitlab"
company = "GitLab"
website = "about.gitlab.com"
offer = "Contract technical writers for release notes and migration guides"
recipient = "Engineering Manager, Documentation"
expect = ["draft"]
note = "The site lives on a subdomain."

[[case]]
id = "canva"
company = "Canva"
website = "canva.com"
offer = "Accessibility audits of design templates against WCAG 2.2"
recipient = "Head of Accessibility"
tone = "Warm"
expect = ["draft"]
holdout = true

[[case]]
